<div class="legend">
  <h2>Reading the Radar</h2>
  <div class="legend-rings">
    @for (ring of rings; track ring.title) {
        <div class="legend-ring">
            <span class="ring-emoji">{{ ring.emoji }}</span>
            <div>
                <strong>{{ ring.title }}</strong>
                <p>{{ ring.description }}</p>
            </div>
        </div>
    }
  </div>
</div>
