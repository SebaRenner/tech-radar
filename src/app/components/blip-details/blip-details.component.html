@let b = blip();

<div class="detail-card">
  <div class="header">
    <app-blip-chips [blip]="b" />
    <button class="close" (click)="closeDetails.emit()">✕</button>
  </div>
  <p class="name">{{ b.name }}</p>
  <p class="description">{{ b.description }}</p>
  @if (b.comment) {
    <div class="comment">
      <p class="comment-label">Comment</p>
      <p class="comment-text">{{ b.comment }}</p>
    </div>
  }
</div>
